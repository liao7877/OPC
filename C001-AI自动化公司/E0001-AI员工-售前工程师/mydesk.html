<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>个人工作台</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --panel-2: #222b35; --border: #2c3742;
    --text: #e6edf3; --text-dim: #8b98a5; --accent: #4f9cf9;
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
    --st-backlog: #8a94a6; --st-in_progress: #3b82f6; --st-review: #f59e0b;
    --st-done: #22c55e; --st-failed: #ef4444; --st-paused: #a855f7; --st-cancelled: #6b7280;
  }
  [data-theme="light"] {
    --bg: #f5f7fa; --panel: #ffffff; --panel-2: #eef1f5; --border: #d8dee6;
    --text: #1a2129; --text-dim: #6b7785; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .brand .sub { font-size: 12px; color: var(--text-dim); }
  .head-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); }
  .stale-input { width: 52px; text-align: center; border-radius: 8px; padding: 5px 6px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-size: 12px; }
  .stale-label { font-size: 12px; color: var(--text-dim); }
  #staleBar { display: none; padding: 8px 20px; font-size: 13px; font-weight: 600;
    color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
    border-bottom: 1px solid var(--warn); }
  main { padding: 6px 20px 40px; max-width: 1280px; margin: 0 auto; }
  section { margin-top: 22px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); letter-spacing: .5px; }
  h2 .cnt { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .idcard { display: flex; flex-wrap: wrap; gap: 16px; align-items: center;
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; }
  .idcard .avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700; }
  .idcard .who { font-size: 17px; font-weight: 700; }
  .grid { display: grid; gap: 12px; }
  .g-stat { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .stat-card { text-align: center; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 8px; }
  .stat-card .num { font-size: 24px; font-weight: 700; }
  .stat-card .lbl { font-size: 12px; color: var(--text-dim); }
  .cols { display: flex; gap: 14px; align-items: flex-start; overflow-x: auto; }
  .column { flex: 0 0 300px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; display: flex; flex-direction: column; }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    border-bottom: 1px solid var(--border); font-weight: 600; }
  .col-dot { width: 9px; height: 9px; border-radius: 50%; }
  .col-count { margin-left: auto; background: var(--panel-2); color: var(--text-dim);
    border-radius: 999px; padding: 1px 8px; font-size: 12px; }
  .col-body { padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
  .wcard .title { font-weight: 600; }
  .badge { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 7px; color: var(--text-dim); font-size: 11px; display: inline-block; margin: 2px 3px 2px 0; }
  .badge a { color: var(--accent); text-decoration: none; }
  .badge.tk a { color: var(--accent); }
  .badge.bad { color: var(--bad); border-color: var(--bad); }
  .dim { color: var(--text-dim); font-size: 12px; }
  .note { margin-top: 6px; font-size: 12px; color: var(--text-dim); }
  .tk-card { display: flex; align-items: center; gap: 10px; }
  .tk-card.paused { opacity: .45; }
  .tk-st { font-size: 11px; font-weight: 700; border-radius: 5px; padding: 1px 7px; color: #fff; white-space: nowrap; }
  .tk-card.click { cursor: pointer; }
  .tk-card.click:hover { border-color: var(--accent); }
  .warn-box { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--warn);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; margin-bottom: 6px; }
  .empty { color: var(--text-dim); font-size: 12px; text-align: center; padding: 16px 0; }
  .no-data { margin: 60px auto; text-align: center; color: var(--text-dim); }
  .no-data code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; color: var(--accent); }
  .ver { font-size: 11px; color: var(--text-dim); }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🧑‍💻 个人工作台 <span class="ver" id="ver"></span></h1>
      <span class="sub" id="genInfo">加载中…</span>
    </div>
    <div class="head-controls">
      <span class="stale-label">陈旧阈值(分)</span>
      <input type="number" min="1" class="stale-input" id="staleMin" />
      <label class="stale-label" style="cursor:pointer;user-select:none"><input type="checkbox" id="archFilter" checked style="vertical-align:-2px" /> 含归档</label>
      <a class="btn" id="dashLink" href="#">🏢 公司驾驶舱</a>
      <a class="btn" id="teamLink" style="display:none" href="#">🧩 团队看板</a>
      <a class="btn" id="kanbanLink" href="#">🗂 工单看板</a>
      <button class="btn" id="syncBtn">🔄 同步</button>
      <button class="btn" id="themeBtn">☀️ 切亮色</button>
    </div>
  </header>
  <div id="staleBar"></div>
  <main id="main"></main>

  <script src="mydesk-data.js"></script>
  <script>
  (function () {
    var DATA = window.MYDESK_DATA;
    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function parseDate(s) {
      if (!s) return null;
      var iso = String(s).trim().replace(" ", "T");
      var d = new Date(iso);
      if (isNaN(d.getTime())) d = new Date(s + "T00:00:00");
      return isNaN(d.getTime()) ? null : d;
    }
    function pct(r) { return (r === null || r === undefined) ? "—" : Math.round(r * 100) + "%"; }

    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeBtn").textContent = t === "dark" ? "☀️ 切亮色" : "🌙 切暗色";
      try { localStorage.setItem("boards-theme", t); } catch (e) {}
    }
    var savedTheme = null;
    try { savedTheme = localStorage.getItem("boards-theme"); } catch (e) {}
    applyTheme(savedTheme || "dark");
    document.getElementById("themeBtn").addEventListener("click", function () {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    var staleMin = 1560;   // 默认 26 小时（服务实时化后可在此调小，如 10 分钟）
    try { staleMin = parseInt(localStorage.getItem("boards-stale-min-v2"), 10) || 1560; } catch (e) {}
    var staleInput = document.getElementById("staleMin");
    staleInput.value = staleMin;
    staleInput.addEventListener("change", function () {
      staleMin = Math.max(1, parseInt(staleInput.value, 10) || 10);
      staleInput.value = staleMin;
      try { localStorage.setItem("boards-stale-min-v2", String(staleMin)); } catch (e) {}
      updateStale();
    });
    function updateStale() {
      var bar = document.getElementById("staleBar");
      if (!DATA || !DATA.generated_at) { bar.style.display = "none"; return; }
      var g = parseDate(DATA.generated_at);
      if (!g) { bar.style.display = "none"; return; }
      var mins = Math.floor((Date.now() - g.getTime()) / 60000);
      if (mins > staleMin) {
        bar.style.display = "block";
        bar.textContent = "⚠️ 数据已陈旧 " + mins + " 分钟——OPC 服务会自动刷新，点「同步」即可取到新数据；若持续出现请检查服务是否在运行（python opc_service.py）或跑 run_boards once（内容停留在 " + DATA.generated_at + "）";
      } else bar.style.display = "none";
    }
    setInterval(updateStale, 5000);

    function statHTML(lbl, num, color) {
      return '<div class="stat-card"><div class="num" style="' + (color ? "color:" + color : "") + '">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
    }
    function workCard(w) {
      // kanban 深链基准：统一取 DATA.links.kanban（生成器按落位产出）
      var tk = w.ticket ? '<span class="badge tk"><a href="' + esc((DATA.links && DATA.links.kanban) || "#") + '?id=' + esc(w.ticket) + '" title="查看工单">' + esc(w.ticket) + "</a></span>" : "";
      var pj = w.project ? '<span class="badge">' + esc(w.project) + "</span>" : "";
      var arch = w.archived ? '<span class="badge" title="已归档至 workspace/worklog-archive/">🗄 归档</span>' : "";
      var deliv = "";
      if (w.deliverable) {
        // deliverable_href 由生成器换算为相对本页的纯路径；页面不再拼 ../
        deliv = w.deliverable_valid && w.deliverable_href
          ? '<span class="badge" title="' + esc(w.deliverable) + '"><a href="' + esc(w.deliverable_href) + '">📎 交付物</a></span>'
          : '<span class="badge bad">📎 交付物路径失效</span>';
      }
      return '<div class="card wcard"><div class="title">' + esc(w.title) + "</div>" +
        '<div><span class="badge">' + esc(w.type) + "</span>" + tk + pj +
        '<span class="badge">' + esc(w.updated || w.date) + "</span>" + deliv + arch + "</div>" +
        (w.note ? '<div class="note">' + esc(w.note) + "</div>" : "") + "</div>";
    }
    function colHTML(title, color, list) {
      return '<div class="column"><div class="col-head"><span class="col-dot" style="background:' + color + '"></span>' +
        title + '<span class="col-count">' + list.length + "</span></div>" +
        '<div class="col-body">' + (list.map(workCard).join("") || '<div class="empty">无</div>') + "</div></div>";
    }
    // 「含归档」筛选：默认勾选显示全部历史；取消勾选只看当年热数据
    function applyArchFilter(entries) {
      var on = document.getElementById("archFilter").checked;
      return on ? entries : entries.filter(function (w) { return !w.archived; });
    }
    function render() {
      // 顶部导航链接统一由 DATA.links 注入（生成器按落位产出，页面零硬编码）
      if (DATA && DATA.links) {
        ['dashLink', 'kanbanLink'].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          var href = id === 'dashLink' ? DATA.links.dashboard : DATA.links.kanban;
          if (href) el.href = href;
        });
      }
      if (!DATA) {
        document.getElementById("main").innerHTML = '<div class="no-data">未找到 <code>mydesk-data.js</code>。<br>请运行 <code>run_boards.bat</code> / <code>./run_boards.sh</code>。</div>';
        return;
      }
      document.title = "个人工作台 · " + (DATA.name || DATA.eid || "");
      document.getElementById("ver").textContent = DATA.page_version || "";
      var M = document.getElementById("main");
      var s = DATA.stats || {}, entries = DATA.entries || [];

      // W1 身份卡
      var teamLink = document.getElementById("teamLink");
      if (DATA.teams && DATA.teams.length) {
        teamLink.style.display = "";
        teamLink.href = DATA.teams[0].teamboard;
        teamLink.textContent = "🧩 " + (DATA.teams[0].name || DATA.teams[0].tid);
      }
      var skills = (DATA.skills || []).map(function (k) { return '<span class="badge">' + esc(k.name) + "</span>"; }).join("");
      var teams = (DATA.teams || []).map(function (t) { return '<span class="badge">' + esc(t.name || t.tid) + "</span>"; }).join("");
      var w1 = '<section id="w1"><div class="idcard"><div class="avatar">' + esc((DATA.name || "?").charAt(0)) + "</div>" +
        '<div><div class="who">' + esc(DATA.name) + ' <span class="dim">' + esc(DATA.eid) + "</span></div>" +
        '<div><span class="badge">' + esc(DATA.role) + '</span><span class="badge">' + esc(DATA.status) + "</span>" + teams + "</div>" +
        (skills ? '<div style="margin-top:4px">' + skills + "</div>" : "") + "</div></div></section>";

      // W2 我的统计
      var w2 = '<section id="w2"><div class="grid g-stat">' +
        statHTML("计划中", s.planned || 0) + statHTML("进行中", s.in_progress || 0, "var(--accent)") +
        statHTML("已完成", s.done || 0, "var(--ok)") + statHTML("在途", s.ongoing || 0) +
        statHTML("完成率", pct(s.rate)) + statHTML("近7天完成", s.done_7d || 0) + "</div></section>";

      // W3 工作记录三列（受「含归档」筛选控制；统计卡始终用全量口径）
      var viewEntries = applyArchFilter(entries);
      var by = { "计划中": [], "进行中": [], "已完成": [] };
      viewEntries.forEach(function (w) { if (by[w.status]) by[w.status].push(w); });
      var w3 = '<section id="w3"><h2>📝 我的工作记录<span class="cnt">维护：本目录 workspace/worklog.md · 只增不删 · 往年已归档</span></h2>' +
        '<div class="cols">' +
        colHTML("计划中", "#8a94a6", by["计划中"]) +
        colHTML("进行中", "var(--accent)", by["进行中"]) +
        colHTML("已完成", "var(--ok)", by["已完成"]) +
        "</div></section>";

      // W4 我的在途工单（paused 置灰显示；🔒=前置阻塞未清，等上游）
      var sm = DATA.status_meta || {};
      var doneIds = {};
      (DATA.all_tasks_done || []).forEach(function (id) { doneIds[id] = 1; });
      var w4 = '<section id="w4"><h2>🎫 我名下的工单<span class="cnt">待领/进行中/待审 + 暂停(灰) + 阻塞(🔒) · 点击看详情</span></h2>' +
        ((DATA.tickets || []).map(function (t) {
          var color = "var(--st-" + t.status + ", var(--text-dim))";
          var blocked = (t.blocked_by || []).some(function (b) { return !doneIds[b]; });
          var blockBadge = blocked ? ' <span class="badge" title="前置未完成：' + esc((t.blocked_by || []).join("、")) + '">🔒 阻塞中</span>' : "";
          return '<div class="card tk-card click' + (t.paused ? " paused" : "") + '" data-href="' + esc(t.detail) + '">' +
            '<span class="tk-st" style="background:' + color + '">' + esc(sm[t.status] || t.status) + "</span>" +
            '<span style="flex:1"><b>' + esc(t.title) + '</b> <span class="dim">' + esc(t.id) + "</span>" +
            (t.priority ? ' <span class="badge">' + esc(t.priority) + "</span>" : "") +
            (t.due ? ' <span class="badge">📅 ' + esc(t.due) + "</span>" : "") +
            blockBadge +
            (t.paused ? ' <span class="dim">(暂停)</span>' : "") + "</span></div>";
        }).join("") || '<div class="dim" style="padding:10px 0">名下暂无在途工单 ✓</div>') + "</section>";

      // 本人相关核验告警
      var wWarn = ((DATA.warnings || []).length)
        ? '<section id="w5"><h2>⚠️ 我的核验提醒</h2>' + DATA.warnings.map(function (w) {
            return '<div class="warn-box">' + esc(w.msg) + "</div>";
          }).join("") + "</section>" : "";

      M.innerHTML = w1 + w2 + w3 + w4 + wWarn;
      Array.prototype.forEach.call(M.querySelectorAll(".tk-card.click"), function (el) {
        el.addEventListener("click", function () { location.href = el.getAttribute("data-href"); });
      });
      updateStale();
      document.getElementById("genInfo").textContent = "实时同步（每3秒）· 数据生成于 " + DATA.generated_at;
    }

    // 「含归档」切换：只重渲染 W3（避免整页闪烁）
    document.getElementById("archFilter").addEventListener("change", function () {
      try { localStorage.setItem("mydesk-arch", document.getElementById("archFilter").checked ? "1" : "0"); } catch (e) {}
      if (DATA) render();
    });
    try {
      if (localStorage.getItem("mydesk-arch") === "0") document.getElementById("archFilter").checked = false;
    } catch (e) {}

    var lastGen = (DATA && DATA.generated_at) || null;
    var syncEl = document.createElement("script");
    syncEl.onload = function () {
      var nd = window.MYDESK_DATA;
      if (nd && nd.generated_at !== lastGen) { lastGen = nd.generated_at; DATA = nd; render(); }
      updateStale();
    };
    syncEl.onerror = function () {
      document.getElementById("genInfo").textContent = "⚠️ 同步失败：找不到 mydesk-data.js（请运行 run_boards）";
    };
    document.body.appendChild(syncEl);
    function reloadData() { syncEl.src = "mydesk-data.js#_=" + Date.now(); }
    function doSync() {
      if (location.protocol === "http:" || location.protocol === "https:") {
        // 实时模式（经 opc_service 打开）：点同步=真重算，再取新数据
        fetch("../api/sync", { cache: "no-store" }).catch(function () {}).then(reloadData);
      } else { reloadData(); }  // file:// 降级：仅重读数据文件
    }
    document.getElementById("syncBtn").addEventListener("click", doSync);
    render();
    setInterval(reloadData, 3000);
  })();
  </script>
</body>
</html>
