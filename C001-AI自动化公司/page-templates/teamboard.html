<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>团队看板</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2129; --panel-2: #222b35; --border: #2c3742;
    --text: #e6edf3; --text-dim: #8b98a5; --accent: #4f9cf9;
    --ok: #22c55e; --warn: #f59e0b; --bad: #ef4444;
  }
  [data-theme="light"] {
    --bg: #f5f7fa; --panel: #ffffff; --panel-2: #eef1f5; --border: #d8dee6;
    --text: #1a2129; --text-dim: #6b7785; --accent: #2563eb;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
  }
  .brand h1 { font-size: 17px; margin: 0; font-weight: 700; }
  .brand .sub { font-size: 12px; color: var(--text-dim); }
  .head-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .btn {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 12px; cursor: pointer; font-size: 13px; text-decoration: none;
  }
  .btn:hover { border-color: var(--accent); }
  .stale-input { width: 52px; text-align: center; border-radius: 8px; padding: 5px 6px;
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); font-size: 12px; }
  .stale-label { font-size: 12px; color: var(--text-dim); }
  #staleBar { display: none; padding: 8px 20px; font-size: 13px; font-weight: 600;
    color: var(--warn); background: color-mix(in srgb, var(--warn) 12%, transparent);
    border-bottom: 1px solid var(--warn); }
  main { padding: 6px 20px 40px; max-width: 1280px; margin: 0 auto; }
  section { margin-top: 22px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--accent); letter-spacing: .5px; }
  h2 .cnt { color: var(--text-dim); font-weight: 400; font-size: 12px; margin-left: 6px; }
  .grid { display: grid; gap: 12px; }
  .g-emp { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
  .g-stat { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .g-proj { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .card.click { cursor: pointer; transition: border-color .12s, transform .08s; }
  .card.click:hover { border-color: var(--accent); transform: translateY(-1px); }
  .stat-card { text-align: center; }
  .stat-card .num { font-size: 26px; font-weight: 700; }
  .stat-card .lbl { font-size: 12px; color: var(--text-dim); }
  .stat-card .sub { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .stat-card .sub .bad { color: var(--bad); }
  /* ---- 组织架构树（纯 CSS 连接线：负责人在上，成员在下，节点可点进个人工作台）---- */
  .org { display: flex; flex-direction: column; align-items: center; padding: 6px 0 10px; }
  .org > .org-node { margin-bottom: 30px; position: relative; min-width: 180px; }
  .org > .org-node:after { content: ""; position: absolute; left: 50%; top: 100%;
    height: 30px; border-left: 2px solid var(--border); }
  .org-kids { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .org-kids .org-node { position: relative; min-width: 170px; }
  .org-kids .org-node:before { content: ""; position: absolute; left: 50%; top: -16px;
    height: 16px; border-left: 2px solid var(--border); }
  .org-node { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; text-align: center; }
  .org-node.click { cursor: pointer; transition: border-color .12s, transform .08s; }
  .org-node.click:hover { border-color: var(--accent); transform: translateY(-1px); }
  .org-node .emp-name { font-size: 14px; }
  .org-crown { color: var(--accent); font-size: 11px; font-weight: 700; margin-bottom: 2px; }
  .org-empty { border: 2px dashed var(--border); border-radius: 12px; padding: 10px 18px;
    color: var(--text-dim); font-size: 13px; margin-bottom: 30px; position: relative; }
  .org-empty:after { content: ""; position: absolute; left: 50%; top: 100%;
    height: 30px; border-left: 2px solid var(--border); }
  .emp-name { font-weight: 700; font-size: 15px; }
  .dim { color: var(--text-dim); font-size: 12px; }
  .badge { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 1px 7px; color: var(--text-dim); font-size: 11px; display: inline-block; margin: 2px 3px 2px 0; }
  .badge.st-on { color: var(--ok); border-color: var(--ok); }
  .bar { height: 6px; border-radius: 4px; background: var(--panel-2); overflow: hidden; display: flex; margin-top: 8px; }
  .bar i { display: block; height: 100%; }
  .bar .b1 { background: #8a94a6; } .bar .b2 { background: var(--accent); } .bar .b3 { background: var(--ok); }
  .feed { display: flex; flex-direction: column; gap: 8px; }
  .feed-item { display: flex; gap: 10px; align-items: baseline; background: var(--panel);
    border: 1px solid var(--border); border-radius: 10px; padding: 8px 12px; }
  .feed-item .when { font-size: 11px; color: var(--text-dim); white-space: nowrap; width: 150px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
  .d-plan { background: #8a94a6; } .d-doing { background: var(--accent); } .d-done { background: var(--ok); }
  .notice { background: var(--panel); border: 1px solid var(--border); border-left: 4px solid var(--accent);
    border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .notice .nt { font-weight: 700; }
  .notice .nb { margin-top: 4px; font-size: 13px; white-space: pre-wrap; }
  .empty { color: var(--text-dim); font-size: 13px; padding: 14px 0; }
  .no-data { margin: 60px auto; text-align: center; color: var(--text-dim); }
  .no-data code { background: var(--panel-2); padding: 2px 6px; border-radius: 5px; color: var(--accent); }
  .ver { font-size: 11px; color: var(--text-dim); }
  /* ===== 克制动效（2026-08-29）：只做过渡与微反馈，不改布局/配色/控件 ===== */
  @keyframes opc-fade-up { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  .opc-enter { animation: opc-fade-up .28s ease both; }
  .card, .stat-card { transition: border-color .18s ease, background .18s ease, transform .18s ease; }
  .card.click:hover, .card:hover, .btn:hover { border-color: var(--accent); transform: translateY(-1px); }
  .btn:active, .card.click:active { transform: translateY(0); }
  body { transition: background-color .2s ease, color .2s ease; }
  @media (prefers-reduced-motion: reduce) {
    .opc-enter { animation: none; }
    .card, .stat-card, .btn, body { transition: none; }
    .card.click:hover, .card:hover, .btn:hover { transform: none; }
  }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <h1>🧩 团队看板 <span class="ver" id="ver"></span></h1>
      <span class="sub" id="genInfo">加载中…</span>
    </div>
    <div class="head-controls">
      <span class="stale-label">陈旧阈值(分)</span>
      <input type="number" min="1" class="stale-input" id="staleMin" />
      <a class="btn" id="dashLink" href="#">🏢 公司驾驶舱</a>
      <a class="btn" id="kanbanLink" href="#">🗂 工单看板</a>
      <button class="btn" id="syncBtn">🔄 同步</button>
      <button class="btn" id="themeBtn">☀️ 切亮色</button>
    </div>
  </header>
  <div id="staleBar"></div>
  <main id="main"></main>

  <script src="teamboard-data.js"></script>
  <script>
  (function () {
    var DATA = window.TEAMBOARD_DATA;
    function esc(s) {
      if (s === null || s === undefined) return "";
      return String(s).replace(/[&<>"]/g, function (c) {
        return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
      });
    }
    function parseDate(s) {
      if (!s) return null;
      var iso = String(s).trim().replace(" ", "T");
      var d = new Date(iso);
      if (isNaN(d.getTime())) d = new Date(s + "T00:00:00");
      return isNaN(d.getTime()) ? null : d;
    }
    function pct(r) { return (r === null || r === undefined) ? "—" : Math.round(r * 100) + "%"; }

    function applyTheme(t) {
      document.documentElement.setAttribute("data-theme", t);
      document.getElementById("themeBtn").textContent = t === "dark" ? "☀️ 切亮色" : "🌙 切暗色";
      try { localStorage.setItem("boards-theme", t); } catch (e) {}
    }
    var savedTheme = null;
    try { savedTheme = localStorage.getItem("boards-theme"); } catch (e) {}
    applyTheme(savedTheme || "dark");
    document.getElementById("themeBtn").addEventListener("click", function () {
      applyTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    // ---- 陈旧阈值 ----
    // 服务托管模式（从 http://127.0.0.1:8765 打开）：OPC 服务实时重生成数据，陈旧阈值无意义 → 隐藏输入框与横幅
    // file:// 直开模式：没有进程兜底，保留提示，避免静默看到旧数据（PRINCIPLES P11：不静默降级）
    var SERVED = (location.protocol === "http:" || location.protocol === "https:");
    var staleMin = 1560;   // 默认 26 小时（仅 file:// 模式生效）
    try { staleMin = parseInt(localStorage.getItem("boards-stale-min-v2"), 10) || 1560; } catch (e) {}
    var staleInput = document.getElementById("staleMin");
    if (SERVED) {   // 隐藏「陈旧阈值(分)」标签与输入框
      document.querySelectorAll(".stale-label, .stale-input").forEach(function (el) { el.style.display = "none"; });
    }
    staleInput.value = staleMin;
    staleInput.addEventListener("change", function () {
      staleMin = Math.max(1, parseInt(staleInput.value, 10) || 10);
      staleInput.value = staleMin;
      try { localStorage.setItem("boards-stale-min-v2", String(staleMin)); } catch (e) {}
      updateStale();
    });
    function updateStale() {
      var bar = document.getElementById("staleBar");
      if (SERVED) { bar.style.display = "none"; return; }   // 服务实时化：不判陈旧
      if (!DATA || !DATA.generated_at) { bar.style.display = "none"; return; }
      var g = parseDate(DATA.generated_at);
      if (!g) { bar.style.display = "none"; return; }
      var mins = Math.floor((Date.now() - g.getTime()) / 60000);
      if (mins > staleMin) {
        bar.style.display = "block";
        bar.textContent = "⚠️ 数据已陈旧 " + mins + " 分钟——OPC 服务会自动刷新，点「同步」即可取到新数据；若持续出现请检查服务是否在运行（python opc_service.py）或跑 run_boards once（内容停留在 " + DATA.generated_at + "）";
      } else bar.style.display = "none";
    }
    setInterval(updateStale, 5000);

    function statHTML(lbl, num, color) {
      return '<div class="card stat-card"><div class="num" style="' + (color ? "color:" + color : "") + '">' + num + '</div><div class="lbl">' + lbl + '</div></div>';
    }
    function render() {
      // 顶部导航链接统一由 DATA.links 注入（生成器按落位产出，页面零硬编码）
      if (DATA && DATA.links) {
        ['dashLink', 'kanbanLink'].forEach(function (id) {
          var el = document.getElementById(id);
          if (!el) return;
          var href = id === 'dashLink' ? DATA.links.dashboard : DATA.links.kanban;
          if (href) el.href = href;
        });
      }
      if (!DATA) {
        document.getElementById("main").innerHTML = '<div class="no-data">未找到 <code>teamboard-data.js</code>。<br>请运行 <code>run_boards.bat</code> / <code>./run_boards.sh</code>。</div>';
        return;
      }
      document.title = "团队看板 · " + (DATA.name || DATA.tid || "");
      document.getElementById("ver").textContent = DATA.page_version || "";
      var M = document.getElementById("main");
      var members = DATA.members || [], acts = DATA.activity || [], projs = DATA.projects || [];
      var s = DATA.stats || {};
      var sm = DATA.status_meta || {};
      var tk = DATA.tickets || { total: 0, active: 0, done: 0, overdue: 0, paused: 0, failed: 0, cancelled: 0, byStatus: {} };
      var leadSet = {};
      (DATA.leads || []).forEach(function (l) { leadSet[l] = 1; });
      var leadNodes = members.filter(function (m) { return leadSet[m.eid]; });
      var kidNodes = members.filter(function (m) { return !leadSet[m.eid]; });

      // t0 组织架构（负责人在上、成员在下；节点点击直达个人工作台）
      function orgNode(m, isLead) {
        return '<div class="org-node click" data-href="' + esc(m.mydesk) + '" title="进入 ' + esc(m.name) + ' 的个人工作台">' +
          (isLead ? '<div class="org-crown">👑 负责人</div>' : "") +
          '<div class="emp-name">' + esc(m.name) + '</div><div class="dim">' + esc(m.eid) + "</div>" +
          '<div style="margin-top:4px"><span class="badge">' + esc(m.role) + '</span><span class="badge ' +
          (m.status === "在职" ? "st-on" : "") + '">' + esc(m.status) + "</span></div></div>";
      }
      var orgHtml = "";
      if (!members.length) {
        orgHtml = '<div class="empty">本团队暂无成员（roster.md「团队」列登记 ' + esc(DATA.tid) + "）</div>";
      } else {
        orgHtml = '<div class="org">' +
          (leadNodes.map(function (m) { return orgNode(m, true); }).join("") ||
            '<div class="org-empty">⚠️ 未设负责人（roster「角色」列标 lead 后自动上树）</div>') +
          (kidNodes.length ? '<div class="org-kids">' + kidNodes.map(function (m) { return orgNode(m, false); }).join("") + "</div>" : "") +
          "</div>";
      }
      var t0 = '<section id="t0"><h2>🏗 组织架构<span class="cnt">负责人 + 成员 · 点击节点进入个人工作台</span></h2>' + orgHtml + "</section>";

      // t1 团队成员（负责人置顶 + 徽标）
      var sortedMembers = leadNodes.concat(kidNodes);
      var t1 = '<section id="t1"><h2>👥 团队成员<span class="cnt">负责人置顶 · 点击进入个人工作台</span></h2><div class="grid g-emp">' +
        (sortedMembers.map(function (m) {
          var ms = m.stats || {}, tt = ms.total || 1;
          var seg = ms.total ? '<div class="bar"><i class="b1" style="width:' + (ms.planned / tt * 100) + '%"></i>' +
            '<i class="b2" style="width:' + (ms.in_progress / tt * 100) + '%"></i>' +
            '<i class="b3" style="width:' + (ms.done / tt * 100) + '%"></i></div>' : "";
          return '<div class="card click" data-href="' + esc(m.mydesk) + '"><div class="emp-name">' +
            (leadSet[m.eid] ? "👑 " : "") + esc(m.name) +
            ' <span class="dim">' + esc(m.eid) + "</span></div>" +
            '<div><span class="badge">' + esc(m.role) + "</span>" +
            (leadSet[m.eid] ? '<span class="badge team">负责人</span>' : "") +
            '<span class="badge ' + (m.status === "在职" ? "st-on" : "") + '">' + esc(m.status) + "</span></div>" +
            '<div class="dim" style="margin-top:6px">在途 ' + (ms.ongoing || 0) + " · 完成 " + (ms.done || 0) + " · 完成率 " + pct(ms.rate) + "</div>" + seg + "</div>";
        }).join("") || '<div class="empty">本团队暂无成员</div>') + "</div></section>";

      // t2 团队统计（2026-08-29 拆对象口径：工单 / 工作条目 分账成卡，悬停有口径说明）
      var tkSub = (((DATA.config || {}).active_status) || ["backlog", "in_progress", "review"]).map(function (k) { return (sm[k] || k) + " " + (tk.byStatus[k] || 0); }).join(" · ");
      var t2 = '<section id="t2"><h2>📊 团队统计 · ' + esc(DATA.name || DATA.tid) + " (" + esc(DATA.tid) + ')</h2><div class="grid g-stat">' +
        statHTML("成员", DATA.member_count != null ? DATA.member_count : members.length) +
        statHTML("🎫 工单·在途", tk.active, "var(--accent)", tkSub,
          "本队成员名下工单：状态=待领/进行中/待审（未进终态）") +
        statHTML("🎫 工单·逾期", tk.overdue, tk.overdue ? "var(--bad)" : null, null,
          "本队成员名下在途工单中已过截止日（due）的数量") +
        statHTML("🎫 工单·已完成", tk.done, "var(--ok)", null, "本队成员名下状态=完成的工单数") +
        statHTML("📝 条目·累计", s.total || 0, null, "在途 " + (s.ongoing || 0) + " · 完成率 " + pct(s.rate),
          "本队成员 worklog 工作条目累计（计划中+进行中+已完成）；在途=计划中+进行中——注意与工单口径分开") +
        statHTML("📝 条目·近7天完成", s.done_7d || 0, null, null, "本队成员近7天完成的 worklog 条目数") +
        statHTML("项目数", projs.length, null, null, "project.md team 字段归属本团队的项目数") +
        "</div></section>";

      var sm = DATA.status_meta || {};
      // kanban 深链基准：统一取 DATA.links.kanban（生成器按落位产出，页面不硬编码）
      var KANBAN = (DATA.links && DATA.links.kanban) || "#";
      var t3 = '<section id="t3"><h2>📁 团队项目<span class="cnt">归属本团队的项目（project.md team 字段）</span></h2><div class="grid g-proj">' +
        (projs.map(function (p) {
          var ts = p.ticket_stats || { total: 0, byStatus: {}, overdue: 0 };
          var chips = Object.keys(ts.byStatus).map(function (k) {
            return '<span class="badge">' + esc(sm[k] || k) + " " + ts.byStatus[k] + "</span>";
          }).join("");
          return '<div class="card click" data-href="' + esc(KANBAN) + '?project=' + encodeURIComponent(p.pid) + '">' +
            '<div class="emp-name">' + esc(p.name) + ' <span class="dim">' + esc(p.pid) + "</span></div>" +
            '<div class="dim" style="margin-top:6px">工单 ' + ts.total +
            (ts.overdue ? ' · <span style="color:var(--bad)">逾期 ' + ts.overdue + "</span>" : "") + "</div>" +
            (chips ? '<div style="margin-top:4px">' + chips + "</div>" : "") + "</div>";
        }).join("") || '<div class="empty">暂无归属本团队的项目（project.md 写 team: ' + esc(DATA.tid) + " 后自动出现）</div>") + "</div></section>";

      var t4 = '<section id="t4"><h2>🌊 团队动态<span class="cnt">本队成员 worklog 时间线</span></h2><div class="feed">' +
        (acts.map(function (a) {
          var dot = a.status === "已完成" ? "d-done" : (a.status === "进行中" ? "d-doing" : "d-plan");
          var tk = a.ticket ? ' <a href="' + esc(KANBAN) + '?id=' + esc(a.ticket) + '" style="color:var(--accent);text-decoration:none;font-size:11px">' + esc(a.ticket) + "</a>" : "";
          return '<div class="feed-item"><span class="when">' + esc(a.updated || a.date) + "</span>" +
            '<span><span class="dot ' + dot + '"></span><b>' + esc(a.name) + "</b> · " + esc(a.title) +
            ' <span class="badge">' + esc(a.type) + "</span>" + tk + ' <span class="dim">[' + esc(a.status) + "]</span></span></div>";
        }).join("") || '<div class="empty">本队暂无工作记录</div>') + "</div></section>";

      var t5 = '<section id="t5"><h2>📢 公告与周报<span class="cnt">维护：团队目录 notices.md</span></h2>' +
        ((DATA.notices || []).map(function (n) {
          return '<div class="notice"><div class="nt">' + esc(n.title) +
            ' <span class="dim">' + esc(n.date) + (n.author ? " · " + esc(n.author) : "") + "</span></div>" +
            '<div class="nb">' + esc(n.body) + "</div></div>";
        }).join("") || '<div class="empty">暂无公告（团队目录新建 notices.md，--- 块式公告）</div>') + "</section>";

      var t6 = '<section id="t6"><h2>🧰 团队资产<span class="cnt">团队级 skills 索引</span></h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">' +
        ((DATA.assets || []).map(function (a) {
          return '<div class="card"><b>' + esc(a.name) + "</b>" +
            (a.desc ? '<div class="dim" style="margin-top:4px">' + esc(a.desc) + "</div>" : "") + "</div>";
        }).join("") || '<div class="empty">暂无团队技能（skills/&lt;name&gt;/SKILL.md）</div>') + "</div></section>";

      M.innerHTML = t2 + t1 + t3 + t4 + t5 + t6;
      Array.prototype.forEach.call(M.querySelectorAll(".card.click"), function (el) {
        el.addEventListener("click", function () { location.href = el.getAttribute("data-href"); });
      });
      updateStale();
      document.getElementById("genInfo").textContent = "实时同步（每3秒）· 数据生成于 " + DATA.generated_at;
    }

    var lastGen = (DATA && DATA.generated_at) || null;
    var syncEl = document.createElement("script");
    syncEl.onload = function () {
      var nd = window.TEAMBOARD_DATA;
      if (nd && nd.generated_at !== lastGen) { lastGen = nd.generated_at; DATA = nd; render(); }
      updateStale();
    };
    syncEl.onerror = function () {
      document.getElementById("genInfo").textContent = "⚠️ 同步失败：找不到 teamboard-data.js（请运行 run_boards）";
    };
    document.body.appendChild(syncEl);
    function reloadData() { syncEl.src = "teamboard-data.js#_=" + Date.now(); }
    function doSync() {
      if (location.protocol === "http:" || location.protocol === "https:") {
        // 实时模式（经 opc_service 打开）：点同步=真重算，再取新数据
        fetch("../api/sync", { cache: "no-store" }).catch(function () {}).then(reloadData);
      } else { reloadData(); }  // file:// 降级：仅重读数据文件
    }
    document.getElementById("syncBtn").addEventListener("click", doSync);
    render();
    setInterval(reloadData, 3000);
  })();
  </script>

<script>
  /* 入场动效 + 数字滚动（2026-08-29 克制版）：初次渲染执行一次；尊重系统「减弱动效」 */
  (function () {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    function run() {
      var cards = document.querySelectorAll("#main .card, .board .card, .column .card, .grid .card");
      Array.prototype.forEach.call(cards, function (el, i) {
        el.classList.add("opc-enter");
        el.style.animationDelay = Math.min(i * 25, 400) + "ms";
      });
      Array.prototype.forEach.call(document.querySelectorAll(".stat-card .num"), function (el) {
        var to = parseInt(el.textContent, 10);
        if (!to) return;
        var t0 = performance.now();
        (function step(now) {
          var p = Math.min(1, (now - t0) / 400);
          el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(step);
        })(t0);
      });
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(run, 0); });
    else setTimeout(run, 0);
  })();
</script>
