# OPC 全局命名空间 manifest（单例 = 物理路径唯一真相源）
# 设计原则：改名/改布局只改本文件，所有 consumer（脚本/AGENTS.md/skill）零改动。
# manifest 所在目录即 OPC 根（resolver 以 manifest 文件位置定位，无 workspace.root 配置项）。
# 对应决策：Q1 选 opc:// URI 符号；Q2 选「全局单例 + 公司级覆盖」。

[company.DEFAULT]
# 骨架默认值：所有公司继承，未覆盖字段沿用此处
workbench = "workbench"
tasks_data = "workbench/tasks-data.json"
roster = "E0000-AI员工-总管/roster.md"   # 总管目录改名后失效时，resolver 按总管 ID 前缀扫描自愈定位
affairs = "workbench/affairs"
page_templates = "page-templates"
templates = "templates"            # 公司模板目录（新建员工骨架来源；opc://company:<cid>/templates/... 经 key 透传解析）
skills = "skills"                  # 技能根目录：skill/<name> -> {home}/skills/<name>
knowledge = "knowledge"            # 知识库根目录（三级同构，决策 #19；物理目录改名只改此处，URI 与引用层无感）
# 注：实体目录前缀的唯一真相已移至 [entity_types]（2026-08-29）；原 teams/projects/employees 三键
# 自落地以来从未被 resolver 消费（配置说谎），已移除——实体解析按 [entity_types] 前缀扫描公司根。

[company.C001]
# 仅覆盖「偏离」字段；其余继承 DEFAULT（约定优于配置）
# Z 方案：home 指向 OS 级稳定锚（companies/C001 = symlink/junction），
# 真实目录改名后只需更新该链接，所有 consumer 零改动且跨平台。
home = "companies/C001"

# ---- OPC 服务（opc_service 消费；进程=宿主、公司=租户）----
[service]
port = 8765
# away_mode 不在场模式：实时通知全部静默，仅每日 09:00 摘要重提全部未处置项（critical 置顶）；
# 绝不代决策（P29）——「等用户拍板」的工单照旧挂起，只是打扰方式降级
away_mode = false
# 预留扩展口子（2026-08-30 拍板）：
#   副署人（路线 3）= 将来 notify_channels 增加通道即可（各公司可不同，分公司路由）；
#   预授权清单 [delegation] = 将来扩展位：把「不在场」变「授权范围」，每一条都是真授权，默认空。

# ---- 巡检报警（opc_patrol 消费）----
[patrol]
notify = true        # A+ 档：发现异常弹系统通知（Win Toast / macOS / Linux notify-send，失败不影响巡检）
quiet_hours = ""     # 勿扰时段（可选）："HH:MM-HH:MM"，空=不启用；跨零点如 "22:00-08:00" 合法。
                     # 时段内 warn/info 通知静默（并入每日 09:00 摘要重提），critical 永远放行
# actor = "log"      # B 阶段扩展位（自动处置）：log=现状 | agent=定时拉起总管会话（未启用）

# ---- 知识库（决策 #19：三级同构 + 腐烂防护；opc_model --sync-index 与 opc_patrol 消费）----
# 阈值一律保守：宁可少报，不可刷屏（三条巡检并入每日 09:00 摘要，不实时弹窗）
[knowledge]
review_warn_days = 7       # 巡检 #13：review_by 到期前 N 天开始提醒复审
cold_hits_days = 90        # 巡检 #15：连续 N 天零命中 → 提醒人工归档（永不自动删）
dupe_similarity = 0.75     # 巡检 #14：疑似重复阈值（标题+tag 重合度），只告警不合并

# ---- 实体类型注册表（2026-08-29 拍板：前缀唯一真相，resolver/生成器/巡检/结构自检统一消费）----
# 加新实体类型（如 customer = "X"）= 加一行；改前缀同理。公司实体目录命名约定 {前缀}{数字}-<名称>（目录自解释；改名走 opc_resolver --rename-entity，引用层按 ID 前缀扫描免疫改名）。
[entity_types]
employee = "E"
team = "T"
project = "P"

# ---- 平台技能披露（opc_resolver.ensure_links 统一托管，2026-08-28 Q3 拍板）----
# 所有「不入库、clone 后必重建」的 OS 级链接（稳定锚 + 各层技能披露）只有一个管理者 = resolver。
# 接新平台（如 Claude Code）只加一段配置，零代码改动。
[platform.workbuddy]
skill_link = ".workbuddy/skills"   # 相对各层目录（公司根/员工/团队，凡含 skills/ 的层自动覆盖）
